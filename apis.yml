name: Insitu
description: >-
  Insitu Inc. is a wholly owned subsidiary of The Boeing Company that designs,
  builds, and operates uncrewed aerial systems (UAS) and related intelligence,
  surveillance, and reconnaissance technologies for defense and government
  customers. Its product line includes the Integrator, ScanEagle, and RQ-21A
  air vehicles alongside imaging payloads, ground control stations, and mission
  software such as TacitView, the Media Management Suite, and the Tungsten SDK.
  Insitu delivers end-to-end capabilities for collecting, processing, and
  distributing information, with more than 1.6 million operational flight hours
  across 30-plus international customers. Insitu operates as a defense contractor
  and publishes no public developer API, developer portal, or OpenAPI surface.
